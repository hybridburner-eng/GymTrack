<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101824">
  <meta name="description" content="GymTrack, your private offline-first workout planner and strength log.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>GymTrack • Train with purpose</title>
  <style>
    :root{color-scheme:dark;--bg:#0b111b;--card:#141d2b;--card2:#1b2635;--line:#2a3648;--text:#f4f7fb;--muted:#a1afc1;--accent:#76ebc0;--accentDark:#102f2a;--warn:#ffca82;--danger:#ffa4a0;--r:18px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}a{color:var(--accent)}
    .shell{max-width:660px;margin:0 auto;padding:20px 16px calc(112px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 1px 17px}.logo{display:flex;align-items:center;gap:11px}.logoicon{width:43px;height:43px;display:grid;place-items:center;border-radius:14px;background:var(--accent);color:#09271e;font-size:23px;font-weight:900}.top h1{font-size:23px;margin:0;letter-spacing:-.6px}.tiny{color:var(--muted);font-size:12px}.eyebrow{font-size:11px;letter-spacing:1.1px;text-transform:uppercase;font-weight:800;color:var(--accent)}.avatar{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);font-size:18px}
    .hero{background:linear-gradient(130deg,#203c3b 0%,#192a32 58%,#172236 100%);border:1px solid #345551;border-radius:23px;padding:21px;overflow:hidden;position:relative;margin:0 0 20px}.hero:after{content:'✦';position:absolute;right:16px;top:-15px;line-height:1;color:#79e6be22;font-size:125px;pointer-events:none}.hero h2{margin:6px 0;font-size:27px;line-height:1.15;letter-spacing:-.5px}.hero p{color:#c3d8d3;margin:6px 0 17px;max-width:430px}.hero .small{font-size:12px;color:#c3d8d3;margin:11px 0 0}
    .section{margin:18px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.section h2{margin:0;font-size:18px;letter-spacing:-.2px}.section .small{font-size:12px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:10px 0}.card.soft{background:var(--card2)}.card h3{margin:0 0 7px;font-size:17px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row.start{align-items:flex-start}.wrap{flex-wrap:wrap}.muted{color:var(--muted)}.small{font-size:13px}.stack{display:grid;gap:10px}.pills{display:flex;flex-wrap:wrap;gap:7px}.pill{padding:5px 10px;border-radius:999px;background:#1e3333;color:#aef5dc;font-size:12px;font-weight:650}.pill.gray{background:#283345;color:#becce0}.pill.warn{background:#41311f;color:#ffd79a}.btn{border:0;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 15px;min-height:44px;font-weight:750;letter-spacing:.01em;transition:opacity .15s}.btn.primary{background:var(--accent);color:#0b2920}.btn.secondary{background:#283648;color:#f5f8fc}.btn.ghost{background:transparent;color:var(--accent);border:1px solid #3a6258}.btn.danger{color:#ffd6d2;border:1px solid #6d3e40;background:#462a30}.btn.text{background:transparent;color:var(--accent);padding:6px 5px;min-height:32px}.btn.sm{padding:7px 11px;min-height:35px;border-radius:10px;font-size:13px}.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.full{width:100%}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;min-width:0}.metric strong{font-size:23px;display:block;margin-top:4px;line-height:1.3}.metric span{font-size:12px;color:var(--muted)}
    .plan{display:flex;align-items:center;gap:13px;justify-content:space-between}.plan-icon{width:47px;height:47px;border-radius:14px;background:#263743;display:grid;place-items:center;font-size:22px;flex-shrink:0}.plan-info{flex:1;min-width:0}.plan-info h3{margin:0 0 4px;font-size:15px}.plan-info p{margin:0;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.arrow{font-size:23px;color:var(--accent)}.formlabel{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:0 0 5px}.field{background:#0e1723;border:1px solid #354256;border-radius:11px;color:var(--text);padding:11px 10px;width:100%;min-width:0;outline:0}.field:focus{border-color:var(--accent)}.field::placeholder{color:#6f8297}.exercise{padding:15px 14px;background:var(--card);border:1px solid var(--line);border-radius:17px;margin:10px 0}.exercise h3{margin:0;font-size:16px}.sethead,.setrow{display:grid;grid-template-columns:31px minmax(0,1fr) minmax(0,1fr) 48px;gap:7px;align-items:center}.sethead{text-align:center;margin:14px 0 6px;color:#8b9bb0;font-size:11px;text-transform:uppercase;letter-spacing:.3px}.setrow{margin:7px 0}.setnumber{background:#293648;color:#b8cadc;border-radius:9px;height:39px;display:grid;place-items:center;font-weight:750}.setrow .field{min-height:43px;text-align:center;padding:8px 4px;font-weight:700}.setrow.done .field{background:#11291f;border-color:#356850;color:#b4f8dc}.checkset{border:1px solid #45566c;background:#223044;color:#d6e2ef;width:43px;height:43px;border-radius:11px;font-size:19px}.checkset.done{background:#2a765a;border-color:#68cf9e;color:white}.remove{border:0;background:transparent;color:var(--danger);font-size:17px;padding:4px 8px}.note{padding:10px 12px;border:1px solid var(--line);border-radius:12px;color:#c1ccda;background:#111b29;font-size:12px}.empty{text-align:center;background:var(--card);border:1px dashed #405066;border-radius:17px;padding:26px 17px;margin:12px 0}.empty .emoji{font-size:37px}.empty h3{margin:6px 0}.empty p{margin:3px 0 15px;color:var(--muted)}
    .navbar{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#101824ef;border-top:1px solid #344256;backdrop-filter:blur(15px);padding:8px 6px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-evenly;gap:4px}.navbtn{border:0;min-width:0;flex:1;display:grid;place-items:center;gap:2px;background:none;color:#8d9fb5;padding:6px 2px 4px;font-size:10px;font-weight:720;max-width:120px}.navbtn .ni{font-size:21px;line-height:1.3}.navbtn.active{color:var(--accent)}
    .timer{position:sticky;top:8px;z-index:4;border:1px solid #3f6d61;border-radius:15px;background:#18332eec;backdrop-filter:blur(12px);display:flex;justify-content:space-between;align-items:center;padding:10px 14px;margin:7px 0 12px}.timer strong{font-size:20px;font-variant-numeric:tabular-nums;color:var(--accent)}.hide{display:none!important}.modalwrap{position:fixed;inset:0;background:#000b;display:grid;place-items:end center;z-index:30;padding:16px 10px env(safe-area-inset-bottom)}.modal{width:100%;max-width:650px;max-height:88vh;overflow-y:auto;background:#192535;border:1px solid #455469;border-radius:22px 22px 16px 16px;padding:19px}.modal h2{margin:0 0 14px;font-size:20px}.editrow{display:grid;grid-template-columns:minmax(0,1fr) 65px 70px 34px;gap:7px;align-items:end;margin:10px 0}.editrow .field{padding:9px 5px;font-size:13px}.editrow .field.name{padding:9px 8px}.help{font-size:12px;color:var(--muted);line-height:1.5}.divider{height:1px;background:var(--line);margin:17px 0}.toast{position:fixed;z-index:45;bottom:95px;left:50%;transform:translateX(-50%);max-width:calc(100% - 26px);width:max-content;background:#334357;color:white;border:1px solid #52667c;box-shadow:0 12px 30px #0008;padding:12px 17px;border-radius:13px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}.chart{display:block;width:100%;height:auto;max-height:210px;background:#101a27;border-radius:13px}.historyexercise{padding:8px 0;border-top:1px solid #2b374a}.historyexercise:first-child{border-top:0}.bottomspace{height:8px}input[type=file]{display:none}svg text{font-family:system-ui,sans-serif}
    @media(min-width:700px){.navbar{left:calc(50% - 330px);right:calc(50% - 330px);border:1px solid #344256;border-radius:18px 18px 0 0}.shell{padding-top:30px}.modalwrap{place-items:center}.modal{border-radius:22px}}
    @media(max-width:350px){.shell{padding-left:10px;padding-right:10px}.btn{padding:10px}.sethead,.setrow{gap:4px}.editrow{grid-template-columns:minmax(0,1fr) 53px 59px 28px}}
  </style>
</head>
<body>
  <main class="shell"><header class="top"><div class="logo"><div class="logoicon">G</div><div><h1>GymTrack</h1><div class="tiny">Train with purpose.</div></div></div><div class="avatar" aria-label="Strength training">🏋️</div></header><div id="app"></div></main>
  <nav class="navbar" aria-label="Main navigation" id="nav"></nav>
  <div id="overlay" class="hide"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
  <datalist id="exerciseOptions"></datalist>
  <script>
  (() => {
    'use strict';
    const KEY='gymtrack_v1_2026';
    const library=['Barbell Bench Press','Incline Dumbbell Press','Dumbbell Shoulder Press','Triceps Pushdown','Lat Pulldown','Seated Cable Row','Face Pull','Dumbbell Biceps Curl','Barbell Squat','Leg Press','Lying Leg Curl','Standing Calf Raise','Romanian Deadlift','Bulgarian Split Squat','Dumbbell Lateral Raise','Pull-up','Push-up','Dip','Cable Fly','Leg Extension','Deadlift','Chest Press Machine','Hammer Curl','Plank','Treadmill'];
    const seedPlans=[
      {name:'Push Day',emoji:'🔥',ex:[['Barbell Bench Press',3,'8-12'],['Incline Dumbbell Press',3,'8-12'],['Dumbbell Shoulder Press',3,'8-12'],['Triceps Pushdown',3,'10-15']]},
      {name:'Pull Day',emoji:'💪',ex:[['Lat Pulldown',3,'8-12'],['Seated Cable Row',3,'8-12'],['Face Pull',3,'12-15'],['Dumbbell Biceps Curl',3,'10-15']]},
      {name:'Leg Day',emoji:'🦵',ex:[['Barbell Squat',3,'6-10'],['Leg Press',3,'10-12'],['Lying Leg Curl',3,'10-15'],['Standing Calf Raise',3,'12-15']]},
      {name:'Upper Body',emoji:'⚡',ex:[['Barbell Bench Press',3,'8-12'],['Seated Cable Row',3,'8-12'],['Dumbbell Lateral Raise',3,'12-15'],['Lat Pulldown',3,'8-12']]},
      {name:'Lower Body',emoji:'🎯',ex:[['Romanian Deadlift',3,'8-10'],['Bulgarian Split Squat',3,'8-12'],['Lying Leg Curl',3,'10-15'],['Standing Calf Raise',3,'12-15']]}
    ];
    const id=()=>{try{return crypto.randomUUID()}catch{return Date.now().toString(36)+Math.random().toString(36).slice(2)}};
    const initial=()=>({version:1,plans:seedPlans.map(p=>({id:id(),name:p.name,emoji:p.emoji,exercises:p.ex.map(x=>({id:id(),name:x[0],sets:x[1],reps:x[2]}))})),sessions:[],active:null,settings:{rest:90}});
    const valid=x=>x&&typeof x==='object'&&Array.isArray(x.plans)&&Array.isArray(x.sessions)&&x.settings&&typeof x.settings==='object';
    let data;
    try{const raw=localStorage.getItem(KEY);const loaded=raw?JSON.parse(raw):null;data=valid(loaded)?loaded:initial()}catch{data=initial()}
    let tab='home',modal=null,selectedExercise='',timerEnd=0,timerId=null,lastTimerSeconds=null,toastTimeout=null;
    const app=document.getElementById('app'),nav=document.getElementById('nav'),overlay=document.getElementById('overlay'),toastEl=document.getElementById('toast');
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const attr=esc;
    const fmtNum=(n,d=0)=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:d});
    const dateFmt=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
    const clock=t=>new Date(t).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
    const duration=ms=>Math.max(1,Math.round(ms/60000))+' min';
    const completedSets=s=>s.exercises.flatMap(e=>e.sets.filter(z=>z.done&&Number(z.reps)>0).map(z=>({...z,name:e.name})));
    const totalVolume=s=>completedSets(s).reduce((sum,z)=>sum+(Number(z.weight)||0)*Number(z.reps),0);
    const completedCount=s=>completedSets(s).length;
    const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
    const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
    function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>toastEl.classList.remove('show'),3200)}
    function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){toast('Storage error. Export a backup now.');return false}}
    function lastSet(name){for(const s of data.sessions){const e=s.exercises.find(e=>e.name.toLowerCase()===name.toLowerCase());if(!e)continue;const done=e.sets.filter(z=>z.done&&z.reps>0);if(done.length)return done[done.length-1]}return null}
    function lastSummary(name){const last=lastSet(name);return last?`${fmtNum(last.weight,1)} kg × ${last.reps} reps`:'Not logged yet'}
    function planEmoji(p){return p.emoji||'🏋️'}
    function planCard(p,withStart=false){return `<div class="card plan"><div class="plan-icon">${esc(planEmoji(p))}</div><div class="plan-info"><h3>${esc(p.name)}</h3><p>${p.exercises.length} exercises · ${esc(p.exercises.slice(0,2).map(x=>x.name).join(', '))}${p.exercises.length>2?'…':''}</p></div>${withStart?`<button class="btn primary sm" data-act="start" data-id="${attr(p.id)}">Start</button>`:`<button class="btn secondary sm" data-act="edit-plan" data-id="${attr(p.id)}">Edit</button>`}</div>`}
    function hero(){if(data.active){const s=data.active;return `<div class="hero"><div class="eyebrow">Session in progress</div><h2>${esc(s.name)}</h2><p>${completedCount(s)} completed sets · Started ${clock(s.startedAt)}</p><button class="btn primary" data-act="tab" data-tab="workout">Resume workout →</button></div>`}
      return `<div class="hero"><div class="eyebrow">READY TO TRAIN?</div><h2>Your next strong session starts here.</h2><p>Pick a planned workout, then adjust exercises and sets whenever you need.</p><button class="btn primary" data-act="jump-plans">Choose a workout →</button><div class="small">Your data stays on this device. Export backups regularly.</div></div>`}
    function home(){const ms=Date.now()-30*86400000,recent=data.sessions.filter(s=>s.endedAt>=ms);const sets=recent.reduce((v,s)=>v+completedCount(s),0);const last=data.sessions[0];return `${hero()}<div class="section"><h2>Last 30 days</h2></div><div class="grid2"><div class="metric"><span>Completed workouts</span><strong>${recent.length}</strong></div><div class="metric"><span>Completed sets</span><strong>${sets}</strong></div></div><div class="section" id="plansection"><h2>Workout plans</h2><button class="btn text" data-act="tab" data-tab="plans">Manage plans →</button></div>${data.plans.map(p=>planCard(p,true)).join('')||'<p>No plans yet.</p>'}<div class="section"><h2>Latest session</h2></div>${last?`<div class="card"><div class="row"><div><strong>${esc(last.name)}</strong><div class="small muted">${dateFmt(last.endedAt)}</div></div><div class="pill">${completedCount(last)} sets</div></div><div class="small muted" style="margin-top:9px">${fmtNum(totalVolume(last),1)} kg × reps (external load)</div></div>`:`<div class="empty"><div class="emoji">📈</div><h3>Your training story starts here.</h3><p>Complete your first session to build history and strength trends.</p></div>`}`}
    function plans(){return `<div class="section"><h2>Your workout templates</h2><button class="btn primary sm" data-act="new-plan">+ New plan</button></div><p class="small muted">Edit the plan anytime. Once you start training, you can add or remove exercises without changing the template.</p>${data.plans.map(p=>planCard(p,false)).join('')||`<div class="empty"><p>No plans. Create one to get started.</p></div>`}`}
    function setRow(e,z,i){return `<div class="setrow ${z.done?'done':''}"><span class="setnumber">${i+1}</span><input aria-label="Set ${i+1} weight in kg" class="field" data-act="set-input" data-ex="${attr(e.id)}" data-set="${attr(z.id)}" data-field="weight" type="number" min="0" max="2000" step="any" inputmode="decimal" placeholder="kg" value="${attr(z.weight)}"><input aria-label="Set ${i+1} reps" class="field" data-act="set-input" data-ex="${attr(e.id)}" data-set="${attr(z.id)}" data-field="reps" type="number" min="0" max="999" step="1" inputmode="numeric" placeholder="reps" value="${attr(z.reps)}"><button aria-label="${z.done?'Mark incomplete':'Complete set '+(i+1)}" class="checkset ${z.done?'done':''}" data-act="toggle-set" data-ex="${attr(e.id)}" data-set="${attr(z.id)}">${z.done?'✓':'○'}</button></div>`}
    function workout(){if(!data.active)return `<div class="empty"><div class="emoji">🏋️</div><h3>No active workout</h3><p>Start any plan to begin logging sets.</p><button class="btn primary" data-act="tab" data-tab="home">Choose a plan</button></div>`;
      const s=data.active;return `<div class="section"><div><div class="eyebrow">Live workout</div><h2>${esc(s.name)}</h2><div class="small muted">Started ${clock(s.startedAt)} · ${completedCount(s)} sets logged</div></div><button class="btn secondary sm" data-act="finish">Finish</button></div><div id="timerArea"></div><div class="note">✅ Tap the circle after entering reps to complete each set. Weight can be 0 kg for bodyweight movements. Changes save automatically.</div>${s.exercises.map(e=>`<section class="exercise"><div class="row start"><div style="min-width:0;flex:1"><h3>${esc(e.name)}</h3><div class="small muted">Target ${esc(e.target||'8-12')} reps · Last: ${esc(lastSummary(e.name))}</div></div><button aria-label="Remove exercise" class="remove" data-act="remove-ex" data-id="${attr(e.id)}">✕</button></div><div class="sethead"><span>Set</span><span>Weight (kg)</span><span>Reps</span><span>Done</span></div>${e.sets.map((z,i)=>setRow(e,z,i)).join('')}<div class="row" style="margin-top:12px"><button class="btn text sm" data-act="add-set" data-id="${attr(e.id)}">+ Add set</button><button class="btn text sm" data-act="fill-last" data-id="${attr(e.id)}">Use last</button><button class="btn text sm" data-act="remove-set" data-id="${attr(e.id)}">− Set</button></div></section>`).join('')}<div class="card"><button class="btn secondary full" data-act="add-ex-modal">+ Add any exercise</button><div class="divider"></div><div class="row"><div><strong>${completedCount(s)} completed sets</strong><div class="small muted">${fmtNum(totalVolume(s),1)} kg × reps of external load</div></div><button class="btn primary" data-act="finish">Finish workout</button></div><button class="btn text sm" style="margin-top:10px;color:var(--danger)" data-act="cancel">Discard this workout</button></div>`}
    function allExerciseNames(){const names=new Set(library);data.plans.forEach(p=>p.exercises.forEach(e=>names.add(e.name)));data.sessions.forEach(s=>s.exercises.forEach(e=>names.add(e.name)));return [...names].sort()}
    function progress(){const recent=data.sessions.filter(s=>s.endedAt>=Date.now()-30*86400000);const vol=recent.reduce((acc,s)=>acc+totalVolume(s),0);const sets=recent.reduce((acc,s)=>acc+completedCount(s),0);
      const names=[...new Set(data.sessions.flatMap(s=>s.exercises.map(e=>e.name)))].sort();if(!names.includes(selectedExercise))selectedExercise=names[0]||'';const points=[];for(const s of [...data.sessions].reverse()){const e=s.exercises.find(e=>e.name===selectedExercise);if(!e)continue;const vals=e.sets.filter(z=>z.done&&z.reps>0);if(vals.length)points.push({x:s.endedAt,y:Math.max(...vals.map(z=>Number(z.weight)||0))})}
      const max=Math.max(...points.map(p=>p.y),1),min=Math.min(...points.map(p=>p.y));const pad=Math.max(2.5,(max-min)*.2);const lo=points.length?Math.max(0,Math.floor((min-pad)/2.5)*2.5):0,hi=Math.max(lo+5,Math.ceil((max+pad)/2.5)*2.5);const xAt=i=>32+(points.length===1?144:(288*i/(points.length-1))),yAt=v=>166-136*(v-lo)/(hi-lo);
      const poly=points.map((p,i)=>`${xAt(i).toFixed(1)},${yAt(p.y).toFixed(1)}`).join(' ');
      const graph=points.length?`<svg class="chart" viewBox="0 0 352 204" role="img" aria-label="Maximum recorded working weight by session for ${attr(selectedExercise)}"><line x1="32" x2="322" y1="166" y2="166" stroke="#506073"/><line x1="32" x2="322" y1="30" y2="30" stroke="#35465b" stroke-dasharray="4 4"/><text x="8" y="34" fill="#a5b5c7" font-size="11">${hi}</text><text x="8" y="170" fill="#a5b5c7" font-size="11">${lo}</text>${points.length>1?`<polyline fill="none" stroke="#76ebc0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${poly}"/>`:''}${points.map((p,i)=>`<circle cx="${xAt(i)}" cy="${yAt(p.y)}" r="4" fill="#76ebc0"/>`).join('')}<text x="32" y="190" fill="#a5b5c7" font-size="11">${esc(dateFmt(points[0].x))}</text><text x="322" y="190" fill="#a5b5c7" text-anchor="end" font-size="11">${esc(dateFmt(points[points.length-1].x))}</text></svg>`:'<div class="empty"><p>No logged sets for this exercise yet.</p></div>';
      return `<div class="section"><h2>Progress & performance</h2></div><p class="small muted">Last 30 days. Completed sets only.</p><div class="grid2"><div class="metric"><span>Sessions</span><strong>${recent.length}</strong></div><div class="metric"><span>Working sets</span><strong>${sets}</strong></div><div class="metric" style="grid-column:span 2"><span>External load volume</span><strong>${fmtNum(vol,1)} <span style="font-size:14px">kg × reps</span></strong></div></div><div class="section"><h2>Strength trend</h2></div><div class="card"><label class="formlabel" for="exerciseMetric">Exercise</label><select class="field" id="exerciseMetric" data-act="choose-metric">${names.length?names.map(n=>`<option ${n===selectedExercise?'selected':''}>${esc(n)}</option>`).join(''):'<option>No logged exercises</option>'}</select><div style="height:12px"></div>${graph}<p class="help">Highest completed working-set weight per session. Compare similar exercises and rep ranges for meaningful strength trends. Bodyweight movement load is not represented.</p></div>`}
    function history(){return `<div class="section"><h2>Workout history</h2><span class="small">${data.sessions.length} sessions</span></div>${!data.sessions.length?`<div class="empty"><div class="emoji">🗓️</div><h3>No finished workouts yet.</h3><p>Your completed sessions will appear here.</p></div>`:data.sessions.map(s=>`<div class="card"><div class="row start"><div><strong>${esc(s.name)}</strong><div class="small muted">${dateFmt(s.endedAt)} · ${duration(s.endedAt-s.startedAt)}</div></div><button class="btn secondary sm" data-act="toggle-history" data-id="${attr(s.id)}">Details</button></div><div class="pills" style="margin:11px 0 0"><span class="pill gray">${completedCount(s)} sets</span><span class="pill gray">${fmtNum(totalVolume(s),1)} kg × reps</span></div><div id="details-${attr(s.id)}" class="hide" style="margin-top:12px">${s.exercises.map(e=>`<div class="historyexercise"><strong>${esc(e.name)}</strong><div class="small muted">${e.sets.filter(z=>z.done&&z.reps>0).map(z=>`${fmtNum(z.weight,1)} kg × ${z.reps}`).join(' · ')||'No completed sets'}</div></div>`).join('')}<button class="btn danger sm" style="margin-top:12px" data-act="delete-history" data-id="${attr(s.id)}">Delete this session</button></div></div>`).join('')}`}
    function settings(){return `<div class="section"><h2>Settings and your data</h2></div><div class="card"><label class="formlabel" for="rest">Automatic rest timer</label><select id="rest" class="field" data-act="rest">${[0,45,60,90,120,180,240].map(v=>`<option value="${v}" ${num(data.settings.rest)===v?'selected':''}>${v===0?'Off':`${v} seconds`}</option>`).join('')}</select><p class="help">Starts after completing a set while the app is open. Background vibration and sound are not guaranteed on every phone.</p></div><div class="card"><h3>Backup & restore</h3><p class="small muted">Your workouts stay in this browser's local storage. They are not synced to GitHub or other devices.</p><div class="stack"><button class="btn primary full" data-act="backup">⬇ Export full backup (JSON)</button><button class="btn secondary full" data-act="csv">⬇ Export completed sets (CSV)</button><label class="btn secondary full" for="importFile" style="cursor:pointer">⬆ Restore from backup</label><input type="file" id="importFile" accept=".json,application/json" data-act="import"></div><p class="help">Restore replaces all existing plans, sessions and any active session. Export a backup first. Avoid clearing browser site data.</p></div><div class="card"><h3>Privacy & limitations</h3><p class="help">No accounts, analytics, or third-party services. Storage is device/browser-specific and may be erased by browser cleanup. Charts show training records, not validated physiological strength estimates.</p><div class="pill gray">GymTrack v1.0 · Offline-first PWA</div></div>`}
    function render(){app.innerHTML=({home,plans,workout,progress,history,settings}[tab]||home)();const buttons=[['home','⌂','Home'],['plans','▦','Plans'],['workout','●','Workout'],['progress','↗','Progress'],['history','◷','History'],['settings','⚙','More']];nav.innerHTML=buttons.map(([t,icon,title])=>`<button class="navbtn ${tab===t?'active':''}" data-act="tab" data-tab="${t}" aria-label="${title}" ${tab===t?'aria-current="page"':''}><span class="ni">${icon}</span>${title}</button>`).join('');if(tab==='workout')drawTimer();if(!modal)overlay.className='hide';document.getElementById('exerciseOptions').innerHTML=allExerciseNames().map(n=>`<option value="${attr(n)}"></option>`).join('')}
    function goto(t){tab=t;render();window.scrollTo({top:0,behavior:'instant'})}
    function begin(pid){if(data.active){if(confirm('You already have an active workout. Resume it instead?'))goto('workout');return}const p=data.plans.find(p=>p.id===pid);if(!p)return;data.active={id:id(),name:p.name,planId:p.id,startedAt:Date.now(),exercises:p.exercises.map(e=>{const prev=lastSet(e.name);return{id:id(),name:e.name,target:e.reps,sets:Array.from({length:e.sets},()=>({id:id(),weight:prev?String(prev.weight):'',reps:'',done:false}))}})};save();goto('workout')}
    function getExercise(eid){return data.active?.exercises.find(e=>e.id===eid)}
    function getSet(eid,sid){return getExercise(eid)?.sets.find(s=>s.id===sid)}
    function finish(){const s=data.active;if(!s)return;const done=completedCount(s);if(!done){toast('Log at least one completed set first.');return}const planned=s.exercises.reduce((v,e)=>v+e.sets.length,0);if(!confirm(`Finish ${s.name}? ${done} completed of ${planned} sets will be saved. Incomplete sets will not count.`))return;data.sessions.unshift({...s,endedAt:Date.now(),exercises:s.exercises.map(e=>({...e,sets:e.sets.filter(z=>z.done&&Number(z.reps)>0)}))});data.active=null;stopTimer();save();goto('history');toast('Workout saved. Great work! 💪')}
    function makeModal(html){modal=true;overlay.className='modalwrap';overlay.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="Edit workout"><div class="row"><h2>${html.title}</h2><button class="btn secondary sm" data-act="close-modal">✕</button></div>${html.body}</div>`}
    function closeModal(){modal=null;overlay.className='hide';overlay.innerHTML=''}
    function planEditor(pid){const p=data.plans.find(p=>p.id===pid);const edit=!!p;const draft=edit?JSON.parse(JSON.stringify(p)):{id:id(),name:'New workout',emoji:'🏋️',exercises:[]};let rows='';for(let i=0;i<draft.exercises.length;i++)rows+=editPlanRow(draft.exercises[i],i);
      makeModal({title:edit?'Edit workout template':'Create workout template',body:`<label class="formlabel">Plan name</label><input class="field" id="planName" maxlength="70" value="${attr(draft.name)}"><div style="height:10px"></div><label class="formlabel">Icon</label><select class="field" id="planIcon">${['🏋️','🔥','💪','🦵','⚡','🎯','🚴','❤️'].map(e=>`<option ${e===draft.emoji?'selected':''}>${e}</option>`).join('')}</select><div class="section"><h2>Exercises</h2></div><div class="help">Each row: exercise name, number of sets, target rep range.</div><div id="planRows">${rows}</div><button class="btn secondary full" data-act="plan-add-row">+ Add exercise</button><div class="divider"></div><div class="stack"><button class="btn primary full" data-act="save-plan" data-id="${attr(draft.id)}">Save workout plan</button>${edit?`<button class="btn danger full" data-act="delete-plan" data-id="${attr(draft.id)}">Delete this plan</button>`:''}</div>`});overlay.dataset.editid=draft.id}
    function editPlanRow(e,i){return `<div class="editrow"><div><label class="formlabel">Exercise</label><input class="field name" list="exerciseOptions" data-edit="name" maxlength="80" value="${attr(e.name)}" placeholder="Exercise"></div><div><label class="formlabel">Sets</label><input class="field" type="number" min="1" max="12" inputmode="numeric" data-edit="sets" value="${e.sets}"></div><div><label class="formlabel">Reps</label><input class="field" maxlength="12" data-edit="reps" value="${attr(e.reps)}"></div><button class="remove" aria-label="Remove row" data-act="plan-del-row">✕</button></div>`}
    function readPlan(){const name=document.getElementById('planName')?.value.trim();const emoji=document.getElementById('planIcon')?.value;const rows=[...document.querySelectorAll('#planRows .editrow')];const exercises=[];for(const r of rows){const e=r.querySelector('[data-edit="name"]').value.trim();const sets=Number(r.querySelector('[data-edit="sets"]').value);const reps=r.querySelector('[data-edit="reps"]').value.trim();if(!e){toast('Every exercise needs a name.');return null}if(!Number.isInteger(sets)||sets<1||sets>12){toast('Choose 1 to 12 sets per exercise.');return null}exercises.push({id:id(),name:e,sets,reps:reps||'8-12'})}if(!name){toast('Enter a workout plan name.');return null}if(!exercises.length){toast('Add at least one exercise.');return null}return {id:overlay.dataset.editid,name,emoji,exercises}}
    function addExerciseModal(){makeModal({title:'Add an exercise',body:`<label class="formlabel">Exercise name</label><input class="field" id="newExercise" list="exerciseOptions" maxlength="80" placeholder="Search or type a custom exercise"><div style="height:13px"></div><div class="grid2"><div><label class="formlabel">Sets</label><input class="field" id="newSets" type="number" min="1" max="12" value="3" inputmode="numeric"></div><div><label class="formlabel">Target reps</label><input class="field" id="newReps" value="8-12" maxlength="12"></div></div><div style="height:17px"></div><button class="btn primary full" data-act="confirm-add-ex">Add to this session</button>`})}
    function startTimer(){const secs=clamp(num(data.settings.rest),0,3600);if(!secs)return;timerEnd=Date.now()+secs*1000;lastTimerSeconds=secs;drawTimer();if(!timerId)timerId=setInterval(tick,400)}
    function stopTimer(){timerEnd=0;lastTimerSeconds=null;if(timerId){clearInterval(timerId);timerId=null}drawTimer()}
    function tick(){if(!timerEnd)return;const secs=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));if(secs===0&&lastTimerSeconds!==0){lastTimerSeconds=0;timerEnd=0;clearInterval(timerId);timerId=null;if(navigator.vibrate)navigator.vibrate([200,90,200]);toast('Rest complete. Ready for your next set!');}else lastTimerSeconds=secs;drawTimer()}
    function drawTimer(){const el=document.getElementById('timerArea');if(!el)return;const secs=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));el.innerHTML=secs>0?`<div class="timer"><div><div class="small muted">REST TIMER</div><strong>${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</strong></div><div class="row"><button class="btn secondary sm" data-act="timer-add">+30s</button><button class="btn ghost sm" data-act="timer-stop">Skip</button></div></div>`:''}
    function download(content,mime,filename){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),12000)}
    function backup(){download(JSON.stringify(data,null,2),'application/json','GymTrack_Backup_'+new Date().toISOString().slice(0,10)+'.json');toast('Backup prepared. Keep the file somewhere safe.')}
    function csv(){const lines=[['Date','Workout','Exercise','Set','Weight_kg','Reps','External_volume_kg_reps']];data.sessions.slice().reverse().forEach(s=>s.exercises.forEach(e=>e.sets.forEach((z,i)=>{if(z.done&&z.reps>0)lines.push([new Date(s.endedAt).toISOString(),s.name,e.name,i+1,z.weight,z.reps,(num(z.weight)*num(z.reps)).toFixed(2)])})));const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';download('\uFEFF'+lines.map(row=>row.map(quote).join(',')).join('\r\n'),'text/csv;charset=utf-8','GymTrack_Sets_'+new Date().toISOString().slice(0,10)+'.csv')}
    function validateImport(x){if(!valid(x)||x.version!==1||x.plans.length>300||x.sessions.length>10000)return false;return x.plans.every(p=>typeof p.id==='string'&&typeof p.name==='string'&&Array.isArray(p.exercises)&&p.exercises.length<150&&p.exercises.every(e=>typeof e.name==='string'&&Number.isInteger(e.sets)&&e.sets>=1&&e.sets<=12))&&x.sessions.every(s=>typeof s.id==='string'&&typeof s.name==='string'&&Number.isFinite(s.endedAt)&&Array.isArray(s.exercises)&&s.exercises.every(e=>typeof e.name==='string'&&Array.isArray(e.sets)&&e.sets.every(z=>Number.isFinite(num(z.weight))&&Number.isFinite(num(z.reps)))))&&(!x.active||Array.isArray(x.active.exercises))}
    async function importFile(input){const file=input.files?.[0];if(!file)return;if(file.size>12*1024*1024){toast('Backup exceeds 12 MB.');input.value='';return}try{const d=JSON.parse(await file.text());if(!validateImport(d))throw Error('Invalid format');if(!confirm('Replace ALL local GymTrack data with this backup? Export a backup of current data first.')){input.value='';return}data=d;data.settings.rest=clamp(num(d.settings.rest??90),0,3600);save();stopTimer();closeModal();goto('home');toast('Backup restored successfully.')}catch{toast('Unable to import. This must be a GymTrack v1 backup.')}input.value=''}
    document.addEventListener('click',e=>{
      const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
      if(act==='tab'){goto(b.dataset.tab);return}if(act==='jump-plans'){document.getElementById('plansection')?.scrollIntoView({behavior:'smooth'});return}if(act==='start'){begin(b.dataset.id);return}if(act==='edit-plan'){planEditor(b.dataset.id);return}if(act==='new-plan'){planEditor(null);return}if(act==='close-modal'){closeModal();return}
      if(act==='add-set'){const ex=getExercise(b.dataset.id);if(!ex)return;const prior=ex.sets.at(-1);ex.sets.push({id:id(),weight:prior?String(prior.weight):'',reps:'',done:false});save();render();return}
      if(act==='remove-set'){const ex=getExercise(b.dataset.id);if(!ex||ex.sets.length<=1){toast('Each exercise must keep one set.');return}const last=ex.sets.at(-1);if(last.done&&!confirm('Remove the last completed set?'))return;ex.sets.pop();save();render();return}
      if(act==='fill-last'){const ex=getExercise(b.dataset.id);if(!ex)return;const z=lastSet(ex.name);if(!z){toast('No previous completed set for this exercise.');return}ex.sets.filter(s=>!s.done).forEach(s=>{s.weight=String(z.weight);s.reps=String(z.reps)});save();render();toast('Previous performance copied. Mark sets done as you perform them.');return}
      if(act==='toggle-set'){const z=getSet(b.dataset.ex,b.dataset.set);if(!z)return;if(!z.done){if(!String(z.reps).trim()||num(z.reps)<=0||!Number.isInteger(num(z.reps))||num(z.reps)>999){toast('Enter a valid number of reps.');return}if(String(z.weight).trim()===''||num(z.weight)<0||num(z.weight)>2000){toast('Enter a weight in kg (0 for bodyweight).');return}z.done=true;startTimer()}else z.done=false;save();render();return}
      if(act==='remove-ex'){const ex=getExercise(b.dataset.id);if(!ex)return;if(ex.sets.some(s=>s.done)&&!confirm(`Remove ${ex.name} including its completed sets from this session?`))return;data.active.exercises=data.active.exercises.filter(e=>e.id!==ex.id);save();render();return}
      if(act==='add-ex-modal'){addExerciseModal();return}if(act==='confirm-add-ex'){const name=document.getElementById('newExercise').value.trim(),count=Number(document.getElementById('newSets').value),target=document.getElementById('newReps').value.trim();if(!name||!Number.isInteger(count)||count<1||count>12){toast('Choose an exercise and 1 to 12 sets.');return}const prev=lastSet(name);data.active.exercises.push({id:id(),name,target:target||'8-12',sets:Array.from({length:count},()=>({id:id(),weight:prev?String(prev.weight):'',reps:'',done:false}))});save();closeModal();render();toast('Exercise added to this workout.');return}
      if(act==='finish'){finish();return}if(act==='cancel'){if(confirm('Discard the entire active workout? This cannot be undone.')){data.active=null;save();stopTimer();goto('home')}return}
      if(act==='timer-stop'){stopTimer();return}if(act==='timer-add'){timerEnd+=30000;drawTimer();return}
      if(act==='plan-add-row'){document.getElementById('planRows').insertAdjacentHTML('beforeend',editPlanRow({name:'',sets:3,reps:'8-12'},0));return}if(act==='plan-del-row'){b.closest('.editrow').remove();return}
      if(act==='save-plan'){const p=readPlan();if(!p)return;const index=data.plans.findIndex(x=>x.id===p.id);if(index<0)data.plans.push(p);else data.plans[index]=p;save();closeModal();goto('plans');toast('Workout plan saved.');return}
      if(act==='delete-plan'){if(confirm('Delete this template? Past workouts will remain in history.')){data.plans=data.plans.filter(p=>p.id!==b.dataset.id);save();closeModal();goto('plans');toast('Plan deleted.')}return}
      if(act==='toggle-history'){document.getElementById('details-'+b.dataset.id)?.classList.toggle('hide');return}
      if(act==='delete-history'){if(confirm('Permanently delete this recorded workout?')){data.sessions=data.sessions.filter(s=>s.id!==b.dataset.id);save();render();toast('Session deleted.')}return}
      if(act==='backup'){backup();return}if(act==='csv'){csv();return}
    });
    document.addEventListener('input',e=>{const t=e.target;if(t.dataset.act!=='set-input')return;const z=getSet(t.dataset.ex,t.dataset.set);if(!z)return;z[t.dataset.field]=t.value;if(z.done)z.done=false;save();const row=t.closest('.setrow');if(row){row.classList.remove('done');row.querySelector('.checkset').classList.remove('done');row.querySelector('.checkset').textContent='○'}const count=data.active?completedCount(data.active):0;const x=document.querySelector('.section .small.muted');if(x&&tab==='workout')x.textContent=`Started ${clock(data.active.startedAt)} · ${count} sets logged`});
    document.addEventListener('change',e=>{const t=e.target;if(t.dataset.act==='rest'){data.settings.rest=clamp(num(t.value),0,3600);save();toast('Rest timer updated.')}if(t.dataset.act==='choose-metric'){selectedExercise=t.value;render()}if(t.dataset.act==='import')importFile(t)});
    overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal()});
    if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}));
    save();render();
  })();
  </script>
</body>
